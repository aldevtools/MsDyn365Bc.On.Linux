# SQL storage layout for the emulated arm64 stack.
#
# MEASURED THE HARD WAY, both directions:
#
#  * The stock 4 GB tmpfs is too small once apps are published (packages and R2R
#    DLLs are blobs in BC's tables), and a SQL write failure on a full
#    filesystem is indistinguishable from the emulation aborts.
#  * But moving /var/opt/mssql/data to a PERSISTENT volume was worse. It makes
#    every restart depend on crash recovery of the existing files, and under
#    emulation that either hangs (container up 1h, sqlservr at 2% CPU, errorlog
#    frozen, no new dump) or crash-loops on startup (10 restarts, exit 248).
#    tmpfs wins precisely because it throws the files away: SQL always starts
#    clean, with no recovery to perform.
#
# So: keep the data dir on tmpfs, just bigger, and put BACKUPS on a persistent
# volume instead. scripts/arm64-backup.sh writes there on a timer and
# scripts/arm64-recover.sh restores the newest one into the fresh tmpfs — which
# preserves developers' work without reintroducing crash recovery.
#
# size=16g is a cap, not a reservation: tmpfs consumes only what is written
# (~1.2 GB for a restored CRONUS, growing with published apps).
services:
  sql:
    tmpfs:
      - /var/opt/mssql/data:size=16g,uid=10001,gid=10001
    volumes:
      - bc-sqlbackups:/backups
volumes:
  bc-sqlbackups:
